<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuro-Neko · Control de Entrenamiento</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          keyframes: {
            'pulse-dot': {
              '0%, 100%': { opacity: '1', transform: 'scale(1)' },
              '50%': { opacity: '0.35', transform: 'scale(0.75)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' },
            },
            'fade-slide': {
              from: { opacity: '0', transform: 'translateY(10px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
            'fade-in': {
              from: { opacity: '0' },
              to: { opacity: '1' },
            },
            'scale-in': {
              from: { opacity: '0', transform: 'scale(0.94)' },
              to: { opacity: '1', transform: 'scale(1)' },
            },
          },
          animation: {
            'pulse-dot': 'pulse-dot 1.6s ease-in-out infinite',
            shimmer: 'shimmer 1.8s ease-in-out infinite',
            'fade-slide': 'fade-slide 0.35s ease-out both',
            'fade-in': 'fade-in 0.25s ease-out both',
            'scale-in': 'scale-in 0.18s ease-out both',
          },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: dark; }

    body {
      background-color: #020617;
      background-image:
        radial-gradient(1100px 520px at 12% -12%, rgba(139, 92, 246, 0.16), transparent 60%),
        radial-gradient(900px 460px at 88% -8%, rgba(217, 70, 239, 0.08), transparent 60%),
        radial-gradient(1400px 800px at 50% 115%, rgba(30, 41, 59, 0.55), transparent 65%),
        linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
      background-size: auto, auto, auto, 44px 44px, 44px 44px;
      background-attachment: fixed;
    }

    /* Glass card: blurred panel with inner highlight and soft shadow. */
    .glass-card {
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(51, 65, 85, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(148, 163, 184, 0.07),
        0 10px 36px rgba(2, 6, 23, 0.45);
    }

    /* Hover lift for cards. */
    .lift { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .lift:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(148, 163, 184, 0.07),
        0 14px 44px rgba(139, 92, 246, 0.10);
    }

    /* Animated shine sweep for progress fills. */
    .progress-shimmer { position: relative; overflow: hidden; }
    .progress-shimmer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.8s ease-in-out infinite;
    }

    /* Tabular numbers for stats. */
    .tnum { font-variant-numeric: tabular-nums; }

    /* Subtle violet glow behind active nav rows. */
    .nav-glow {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.16), rgba(139, 92, 246, 0.02));
      box-shadow: inset 2px 0 0 0 #8b5cf6;
    }

    /* Scrollbars. */
    * { scrollbar-width: thin; scrollbar-color: rgba(100, 116, 139, 0.45) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.6); }
  </style>
</head>
<body class="text-slate-200 font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
