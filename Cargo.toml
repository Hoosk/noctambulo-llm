[package]
name = "noctambulo-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[features]
# Optional CUDA backend for the CLI (train/eval/generate/export). Build with
# `cargo build --release --features cuda`; the web server keeps using WGPU.
cuda = ["burn/cuda"]

[dependencies]
# Deep Learning (Burn 0.22 dispatch tensors; models use the burnpack store).
# Default features are disabled: they pull burn-wgpu's fusion/autotune, and
# Burn 0.22's fusion graph cache returned wrong matmul results in this engine
# (reproduced against a manual f64 reference; Flex and no-fusion WGPU are
# exact). Re-enable default features once the upstream fusion cache is fixed.
burn = { version = "0.22", default-features = false, features = ["std", "wgpu", "flex", "train", "autodiff", "store"] }


# Tokenización y acceso a Hugging Face
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }

# Solo para guardar/cargar la configuración del modelo
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lectura de datasets Parquet (cosmopedia, wikitext)
parquet = "60.0"
arrow = "60.0"

# SIGINT (Ctrl+C) handling for graceful training stop
libc = "0.2"

# Servidor web para control de entrenamiento (subcomando `serve`)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
futures-core = "0.3"
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
wgpu = "30.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sysinfo = "0.39.6"
