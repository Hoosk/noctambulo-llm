[package]
name = "noctambulo-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
# Optional CUDA backend for the CLI (train/eval/generate/export). Build with
# `cargo build --release --features cuda`; the web server keeps using WGPU.
cuda = ["burn/cuda"]

[dependencies]
# Deep Learning (última versión disponible en crates.io)
# Autotune stays enabled: without it the fallback f16 kernels are wrong on
# WGPU (f16 training collapses to loss 0). Autotune's only known defect is the
# M=1 GEMV kernel (wrong for output width >= 32); the model avoids it by
# padding single-token forwards to M=2 before every matmul.
burn = { version = "0.21", features = ["wgpu", "train", "autodiff", "fusion"] }


# Tokenización y acceso a Hugging Face
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }

# Solo para guardar/cargar la configuración del modelo
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lectura de datasets Parquet (cosmopedia, wikitext)
parquet = "60.0"
arrow = "60.0"

# SIGINT (Ctrl+C) handling for graceful training stop
libc = "0.2"

# Servidor web para control de entrenamiento (subcomando `serve`)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
futures-core = "0.3"
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
wgpu = "29.0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sysinfo = "0.39.6"
# CPU-only backend: deterministic tests and GPU-free model conversion.
burn-ndarray = "0.21"
