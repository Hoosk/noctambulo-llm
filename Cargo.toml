[package]
name = "kuro-neko-llm"
version = "0.1.0"
edition = "2021"

[features]
# Optional CUDA backend for the CLI (train/eval/generate/export). Build with
# `cargo build --release --features cuda`; the web server keeps using WGPU.
cuda = ["burn/cuda"]

[dependencies]
# Deep Learning (última versión disponible en crates.io)
# `default-features = false` disables burn-wgpu's default `autotune` feature.
# Autotune benchmarks speed only and on WGPU it selects a GEMV kernel that
# returns wrong results for M=1 (token-by-token generation); the non-autotuned
# fallback kernels are exact. Re-enable once the upstream kernel is fixed.
burn = { version = "0.21", default-features = false, features = ["std", "wgpu", "train", "autodiff", "fusion"] }


# Tokenización y acceso a Hugging Face
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }

# Solo para guardar/cargar la configuración del modelo
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lectura de datasets Parquet (cosmopedia, wikitext)
parquet = "59.1.0"
arrow = "59.1.0"

# SIGINT (Ctrl+C) handling for graceful training stop
libc = "0.2"

# Servidor web para control de entrenamiento (subcomando `serve`)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
futures-core = "0.3"
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
wgpu = "29.0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
# CPU-only deterministic backend for training/resume verification tests.
burn-ndarray = "0.21"
