[package]
name = "noctambulo-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
# Portable backends: WGPU (auto graphics API), Vulkan/SPIR-V, WebGPU, Flex CPU
# (SIMD + Rayon), and Burn Remote (client + server over WebSocket/Iroh).
default = ["wgpu", "vulkan", "webgpu", "flex", "simd", "rayon", "remote"]

wgpu = ["burn/wgpu"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
flex = ["burn/flex"]
simd = ["burn/simd"]
rayon = ["burn/rayon"]
remote = ["burn/remote", "burn/remote-server", "burn/remote-websocket"]

# Hardware backends / experiments are opt-in.
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
metal = ["burn/metal"]
cpu = ["burn/cpu"]
x86-v4 = ["burn/x86-v4"]
fusion = ["burn/fusion"]
autotune = ["burn/autotune"]

[dependencies]
# Deep Learning (Burn 0.22 dispatch tensors; models use the burnpack store).
# Backend features are selected above and default to the portable set. Fusion
# and autotune stay opt-in: Burn 0.22 returns wrong results when both are
# enabled together in cached decode (upstream burn#5257).
burn = { version = "0.22", default-features = false, features = ["std", "train", "autodiff", "store"] }


# Tokenización y acceso a Hugging Face
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }

# Solo para guardar/cargar la configuración del modelo
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lectura de datasets Parquet (cosmopedia, wikitext)
parquet = "60.0"
arrow = "60.0"

# SIGINT (Ctrl+C) handling for graceful training stop
libc = "0.2"

# Servidor web para control de entrenamiento (subcomando `serve`)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header"] }
futures-core = "0.3"
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
wgpu = "30.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sysinfo = "0.39.6"
