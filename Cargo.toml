[package]
name = "kuro-neko-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Deep Learning (última versión disponible en crates.io)
burn = { version = "0.21", features = ["wgpu", "train", "autodiff", "fusion"] }


# Tokenización y acceso a Hugging Face
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }

# Solo para guardar/cargar la configuración del modelo
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Lectura de datasets Parquet (cosmopedia, wikitext)
parquet = "59.1.0"
arrow = "59.1.0"

# Servidor web para control de entrenamiento (subcomando `serve`)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
